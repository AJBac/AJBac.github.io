---
layout: default
title: little messages
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>little messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #130f08;
    --bg2: #1e1609;
    --bg3: #271c0c;
    --border: #3d2e14;
    --border-hover: #6b4e22;
    --amber: #e8a040;
    --amber-dim: #a06820;
    --text: #f0e0c0;
    --text-dim: #9a7a50;
    --text-faint: #5a4020;
    --green: #6dbf7e;
    --red: #c05040;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lora', Georgia, serif;
    min-height: 100vh;
    line-height: 1.6;
  }

  body { padding: 0; }

  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }

  header {
    margin-bottom: 2.5rem;
    border-bottom: 0.5px solid var(--border);
    padding-bottom: 1.5rem;
  }

  h1 {
    font-size: 28px;
    font-weight: 400;
    color: var(--amber);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
  }

  .section { margin-bottom: 2rem; }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 10px;
    display: block;
  }

  .modules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  .module-card {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1.25rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }

  .module-card:hover:not(.inactive) { border-color: var(--border-hover); background: var(--bg3); }
  .module-card.selected { border: 1.5px solid var(--amber); background: var(--bg3); }
  .module-card.inactive { opacity: 0.4; cursor: not-allowed; }

  .module-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 5px;
  }

  .module-status {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }

  .status-dot.off { background: var(--text-faint); }

  input[type="text"], textarea {
    width: 100%;
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Lora', Georgia, serif;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus, textarea:focus { border-color: var(--amber-dim); }

  textarea {
    min-height: 90px;
    resize: vertical;
    line-height: 1.6;
  }

  .char-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    text-align: right;
    margin-top: 4px;
  }

  .char-count.warn { color: var(--red); }

  .graphic-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .graphic-pill {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .graphic-pill:hover { border-color: var(--border-hover); color: var(--text); }
  .graphic-pill.selected { border-color: var(--amber); color: var(--amber); background: var(--bg3); }

  .pixel-editor-wrap {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    display: none;
  }

  .pixel-editor-wrap.visible { display: block; }

  .pixel-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .tool-btn {
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .tool-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .tool-btn.active { border-color: var(--amber); color: var(--amber); }

  #pixel-canvas {
    display: grid;
    grid-template-columns: repeat(32, 1fr);
    gap: 1px;
    background: #0a0804;
    border: 0.5px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    user-select: none;
    cursor: crosshair;
    touch-action: none;
  }

  .pixel {
    aspect-ratio: 1;
    background: #0a0804;
    border-radius: 1px;
    transition: background 0.05s;
  }

  .pixel.on { background: var(--amber); }

  .countdown-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .toggle-switch {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }

  .toggle-switch input { opacity: 0; width: 0; height: 0; }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .toggle-track::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 3px;
    width: 12px;
    height: 12px;
    background: var(--text-faint);
    border-radius: 50%;
    transition: transform 0.15s, background 0.15s;
  }

  .toggle-switch input:checked + .toggle-track { background: var(--bg3); border-color: var(--amber-dim); }
  .toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); background: var(--amber); }

  .toggle-label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .countdown-fields { display: none; }
  .countdown-fields.visible { display: block; }

  .countdown-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  input[type="date"] {
    width: 100%;
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'DM Mono', monospace;
    outline: none;
    transition: border-color 0.15s;
    color-scheme: dark;
  }

  input[type="date"]:focus { border-color: var(--amber-dim); }

  .send-btn {
    width: 100%;
    background: var(--amber);
    border: none;
    border-radius: 10px;
    padding: 14px;
    color: var(--bg);
    font-size: 15px;
    font-family: 'Lora', Georgia, serif;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    margin-top: 0.5rem;
  }

  .send-btn:hover { background: #f0b050; }
  .send-btn:active { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .status-msg {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    text-align: center;
    margin-top: 12px;
    min-height: 18px;
    color: var(--text-dim);
  }

  .status-msg.success { color: var(--green); }
  .status-msg.error { color: var(--red); }

  .divider {
    border: none;
    border-top: 0.5px solid var(--border);
    margin: 1.5rem 0;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>little messages</h1>
    <p class="subtitle">send something warm to a module near you</p>
  </header>

  <div class="section">
    <span class="section-label">send to</span>
    <div class="modules-grid">
      <div class="module-card selected" data-bin="6a0b29bf6877513b27911a0f" onclick="selectModule(this)">
        <p class="module-name">Sofia Module</p>
        <p class="module-status"><span class="status-dot"></span> online</p>
      </div>
      <div class="module-card inactive" data-bin="">
        <p class="module-name">AJ Module</p>
        <p class="module-status"><span class="status-dot off"></span> coming soon</p>
      </div>
    </div>
  </div>

  <hr class="divider">

  <div class="section">
    <span class="section-label">your name</span>
    <input type="text" id="sender" placeholder="who's this from?" maxlength="20">
  </div>

  <div class="section">
    <span class="section-label">message</span>
    <textarea id="message" placeholder="say something nice..." maxlength="120" oninput="updateCharCount()"></textarea>
    <p class="char-count" id="char-count">0 / 120</p>
  </div>

  <hr class="divider">

  <div class="section">
    <span class="section-label">graphic</span>
    <div class="graphic-options">
      <span class="graphic-pill selected" data-graphic="smiley" onclick="selectGraphic(this)">smiley</span>
      <span class="graphic-pill" data-graphic="heart" onclick="selectGraphic(this)">heart</span>
      <span class="graphic-pill" data-graphic="custom" onclick="selectGraphic(this)">draw your own</span>
    </div>

    <div class="pixel-editor-wrap" id="pixel-editor">
      <div class="pixel-toolbar">
        <button class="tool-btn active" id="btn-draw" onclick="setTool('draw')">draw</button>
        <button class="tool-btn" id="btn-erase" onclick="setTool('erase')">erase</button>
        <button class="tool-btn" onclick="clearCanvas()">clear</button>
        <button class="tool-btn" onclick="fillCanvas()">fill</button>
      </div>
      <div id="pixel-canvas"></div>
    </div>
  </div>

  <hr class="divider">

  <div class="section">
    <span class="section-label">countdown</span>
    <div class="countdown-toggle">
      <label class="toggle-switch">
        <input type="checkbox" id="countdown-toggle" onchange="toggleCountdown()">
        <span class="toggle-track"></span>
      </label>
      <span class="toggle-label" id="toggle-label">keep existing countdown</span>
    </div>
    <div class="countdown-fields" id="countdown-fields">
      <div class="countdown-row">
        <div>
          <span class="section-label">date</span>
          <input type="date" id="countdown-date">
        </div>
        <div>
          <span class="section-label">label</span>
          <input type="text" id="countdown-label" placeholder="e.g. until christmas" maxlength="16">
        </div>
      </div>
    </div>
  </div>

  <hr class="divider">

  <button class="send-btn" id="send-btn" onclick="sendMessage()">send to Sofia Module</button>
  <p class="status-msg" id="status-msg"></p>
</div>

<script>
  const JSONBIN_API_KEY = '$2a$10$lkdJWDP2zV1O4E3MYb4/uO3FevPaOvIAFIr1YOJJKHcGHQaWIGW3q';

  const modules = {
    '6a0b29bf6877513b27911a0f': { name: 'Sofia Module', countdownTarget: 0, countdownLabel: '' }
  };

  let selectedBin = '6a0b29bf6877513b27911a0f';
  let selectedGraphic = 'smiley';
  let currentTool = 'draw';
  let isDrawing = false;
  let pixelData = new Array(1024).fill(0);

  // — Module selection —
  function selectModule(card) {
    if (card.classList.contains('inactive')) return;
    document.querySelectorAll('.module-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedBin = card.dataset.bin;
    const name = card.querySelector('.module-name').textContent;
    document.getElementById('send-btn').textContent = `send to ${name}`;
    loadExistingData();
  }

  // — Graphic selection —
  function selectGraphic(pill) {
    document.querySelectorAll('.graphic-pill').forEach(p => p.classList.remove('selected'));
    pill.classList.add('selected');
    selectedGraphic = pill.dataset.graphic;
    const editor = document.getElementById('pixel-editor');
    if (selectedGraphic === 'custom') {
      editor.classList.add('visible');
      if (document.getElementById('pixel-canvas').children.length === 0) buildCanvas();
    } else {
      editor.classList.remove('visible');
    }
  }

  // — Pixel editor —
  function buildCanvas() {
    const canvas = document.getElementById('pixel-canvas');
    canvas.innerHTML = '';
    for (let i = 0; i < 1024; i++) {
      const px = document.createElement('div');
      px.className = 'pixel';
      px.dataset.index = i;
      canvas.appendChild(px);
    }

    canvas.addEventListener('mousedown', e => { isDrawing = true; paintPixel(e); });
    canvas.addEventListener('mousemove', e => { if (isDrawing) paintPixel(e); });
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseleave', () => isDrawing = false);

    canvas.addEventListener('touchstart', e => { e.preventDefault(); isDrawing = true; paintTouch(e); }, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); if (isDrawing) paintTouch(e); }, { passive: false });
    canvas.addEventListener('touchend', () => isDrawing = false);
  }

  function paintPixel(e) {
    const px = e.target.closest('.pixel');
    if (!px) return;
    const idx = parseInt(px.dataset.index);
    const val = currentTool === 'draw' ? 1 : 0;
    pixelData[idx] = val;
    px.classList.toggle('on', val === 1);
  }

  function paintTouch(e) {
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    if (el && el.classList.contains('pixel')) {
      const idx = parseInt(el.dataset.index);
      const val = currentTool === 'draw' ? 1 : 0;
      pixelData[idx] = val;
      el.classList.toggle('on', val === 1);
    }
  }

  function setTool(tool) {
    currentTool = tool;
    document.getElementById('btn-draw').classList.toggle('active', tool === 'draw');
    document.getElementById('btn-erase').classList.toggle('active', tool === 'erase');
  }

  function clearCanvas() {
    pixelData.fill(0);
    document.querySelectorAll('.pixel').forEach(px => px.classList.remove('on'));
  }

  function fillCanvas() {
    pixelData.fill(1);
    document.querySelectorAll('.pixel').forEach(px => px.classList.add('on'));
  }

  // — Countdown toggle —
  function toggleCountdown() {
    const checked = document.getElementById('countdown-toggle').checked;
    document.getElementById('countdown-fields').classList.toggle('visible', checked);
    document.getElementById('toggle-label').textContent = checked ? 'update countdown date' : 'keep existing countdown';
  }

  // — Char count —
  function updateCharCount() {
    const msg = document.getElementById('message').value;
    const el = document.getElementById('char-count');
    el.textContent = `${msg.length} / 120`;
    el.classList.toggle('warn', msg.length > 100);
  }

  // — Load existing bin data to pre-fill countdown —
  async function loadExistingData() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${selectedBin}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY, 'X-Bin-Meta': 'false' }
      });
      if (res.ok) {
        const data = await res.json();
        modules[selectedBin].countdownTarget = data.countdown_target || 0;
        modules[selectedBin].countdownLabel = data.countdown_label || '';
        if (data.countdown_target) {
          const d = new Date(data.countdown_target * 1000);
          document.getElementById('countdown-date').value = d.toISOString().split('T')[0];
        }
        if (data.countdown_label) {
          document.getElementById('countdown-label').value = data.countdown_label;
        }
      }
    } catch (e) {}
  }

  // — Send message —
  async function sendMessage() {
    const sender = document.getElementById('sender').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!sender) { showStatus('please enter your name', 'error'); return; }
    if (!message) { showStatus('please enter a message', 'error'); return; }

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    showStatus('sending...', '');

    const updateCountdown = document.getElementById('countdown-toggle').checked;
    let countdownTarget = modules[selectedBin].countdownTarget;
    let countdownLabel = modules[selectedBin].countdownLabel;

    if (updateCountdown) {
      const dateVal = document.getElementById('countdown-date').value;
      const labelVal = document.getElementById('countdown-label').value.trim();
      if (dateVal) countdownTarget = Math.floor(new Date(dateVal).getTime() / 1000);
      if (labelVal) countdownLabel = labelVal;
    }

    const payload = {
      message,
      sender,
      graphic: selectedGraphic,
      bitmap: selectedGraphic === 'custom' ? pixelData : [],
      countdown_target: countdownTarget,
      countdown_label: countdownLabel
    };

    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${selectedBin}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_API_KEY
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        showStatus('message sent!', 'success');
        modules[selectedBin].countdownTarget = countdownTarget;
        modules[selectedBin].countdownLabel = countdownLabel;
      } else {
        showStatus('something went wrong, try again', 'error');
      }
    } catch (e) {
      showStatus('connection error', 'error');
    }

    btn.disabled = false;
  }

  function showStatus(msg, type) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = `status-msg ${type}`;
  }

  loadExistingData();
</script>
</body>
</html>
